{% extends "base.html" %}
{% block title %} Company Internship {% endblock %}


{% block content %}




<div class="content-fluid">
    <div><h2>Create internship</h2></div>
   
<div class="cprofile">
    <form action="{{url_for('create_internship')}}" method="POST">
        <div class="cpprofile">
            <div class="mb-3">
                <label for="job_title" class="form-label"> Job Title</label>
                <input type="text" class="form-control" name="job_title" placeholder=" Enter Job Title">
            </div>


            <div class="mb-3">
                <label for="job_description" class="form-label">Job Description</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" name="job_description" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="criteria" class="form-label">Eligibility Criteria</label>
                <input type="text" class="form-control" name="criteria" >
            </div>

            <div class="mb-3">
                <label for="salary_package" class="form-label">Salary Package</label>
                <input type="text" class="form-control" name="salary_package" placeholder=" e.g., 10-60LPA">
            </div>

            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" name="location" >
            </div>

            <div class="mb-3">
                <label for="application_deadline" class="form-label">Application Deadline</label>
                <input type="date" class="form-control" name="application_deadline" >
            </div>

            <button type="submit" class="upbtn">Create Drive</button>
            <a href="{{url_for('company_dashboard')}}"><button type="button" class="btn btn-secondary">Cancel</button></a>
        </div>
    </form>
</div>


</div>


{% endblock %}
