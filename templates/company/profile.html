{% extends "base.html" %}
{% block title %} Company profile {% endblock %}


{% block content %}



<div class="content-fluid">

    <div><h2>Company Profile</h2></div>
   

    <div class="cprofile" >
    
        <form action="{{url_for('company_profile')}}" method="POST">
            <div class="cpprofile">
                <div class="mb-3">
                <label for="name" class="form-label"> Company Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter Company name" >
                </div>

                <div class="mb-3">
                <label for="hr_contact" class="form-label"> Hr Contact</label>
                <input type="email" class="form-control" name="hr_contact" placeholder="Enter contact detailes"  >
                </div>

                <div class="mb-3">
                <label for="website" class="form-label">Website</label>
                <input type="text" class="form-control" name="website" placeholder="Enter Company Address">
                </div>

                <div class="mb-3">
                <label for="description" class="form-label">Company Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea >
                </div>

                <div class="mb-3">
                <label for="address" class="form-label">Company Address</label>
                <textarea class="form-control" id="address" name="address" rows="3"></textarea >
                </div>

                <button type="submit" class="upbtn">Update Profile</button>
                <a href="{{url_for('company_dashboard')}}"><button type="button" class="btn btn-secondary">Cancel</button></a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
