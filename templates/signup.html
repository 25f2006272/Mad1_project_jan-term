{%extends "base.html" %}
{% block title %} Login-page {% endblock %}

{% block content %}

<div class="login1">
    <form method="post" action="/signup">
        <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Name" >
        </div>
        <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label">Email</label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="example@gmail.com">
        </div>
    
        <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label">Phone No.</label>
            <input type="number" class="form-control" id="exampleFormControlInput1" placeholder="phone Number">
        </div>
                <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label"> password</label>
            <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="password">
        </div>
        <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="password">
        </div>
       <div > <input type="submit" value="signup" class="signup-btn"> </div> 
    </form>
     <hr>
    <p class="text-center mb-0">
        Already have an account? <a href="{{url_for('login')}}">Login</a> 
    </p>
    

</div>



{% endblock %}
