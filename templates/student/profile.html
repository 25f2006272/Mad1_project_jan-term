{% extends "base.html" %}
{% block title %} student profile {% endblock %}

{% block content %}
<div class="content-fluid">
    <div><h2>My Profile</h2></div>
   
<div class="studentprofile">
 <form action="{{url_for('student_profile')}}" method="POST">
        <div>
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="name" class="form-control" id="name" placeholder="Name" name="name">
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="number" class="form-control" id="phone" placeholder="Phone Number" name="phone">
            </div>

            <div class="mb-3">
                <label for="branch" class="form-label">Branch</label>
                <input type="text" class="form-control" id="branch" placeholder="Branch" name="branch">
            </div>

            <div class="mb-3">
                <label for="graduation" class="form-label">Graduation year</label>
                <input type="number" class="form-control" id="graduation" placeholder="e.g., 2026" name="graduation">
            </div>
            
            <div class="mb-3">
                <label for="skill" class="form-label">Skills</label>
                <input type="text" class="form-control" id="skill" placeholder="e.g., Python, Java, Machjine Learning, AI" name="skill">
            </div>        

            <div class="mb-3">
                <label for="resume" class="form-label">Upload Resume</label>
                <input type="file" class="form-control" id="resume" placeholder="Upload Resume" name="resume">
            </div>

            
            <button class="upbtn" type="submit">Update Profile</button>

            <a href="{{url_for('student_dashboard')}}"><button type="button" class="btn btn-secondary">Cancel</button></a>
            



        </div>
    </form>
</div>

</div>
{% endblock %}
